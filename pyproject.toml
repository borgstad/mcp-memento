[project]
name = "mcp-memento"
version = "0.1.0"
description = "UUID-addressed, section-aware CLI for an org-roam knowledge base"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "orgparse>=0.4.20240120",
    "typer>=0.12.0",
    "mcp>=1.0.0",
]

[project.scripts]
memento = "memento.cli:main"
memento-mcp = "memento.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memento"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
